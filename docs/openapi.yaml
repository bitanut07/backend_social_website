  /api/v1/assistant/conversations:
    get:
      tags:
        - Trợ lý
      summary: Lấy lịch sử chat với Artly
      description: |
        Trả về các hội thoại thuộc tài khoản hiện tại, mới hoạt động nhất trước.
        Hội thoại chỉ được tạo sau khi trợ lý trả lời thành công
        cho tin nhắn đầu tiên.
      operationId: listAssistantConversations
      security:
        - DemoUserId: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/AssistantConversationPageSize"
      responses:
        "200":
          description: Danh sách hội thoại và thông tin phân trang.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/DemoIdentityRequired"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/assistant/conversations/{id}:
    parameters:
      - $ref: "#/components/parameters/AssistantConversationId"
    get:
      tags:
        - Trợ lý
      summary: Mở lại một lịch sử chat
      description: |
        Trả về metadata và toàn bộ tin nhắn theo đúng thứ tự. Nếu ID không tồn
        tại hoặc thuộc tài khoản khác, API trả 404 để không làm lộ dữ liệu.
      operationId: getAssistantConversation
      security:
        - DemoUserId: []
      responses:
        "200":
          description: Hội thoại và các tin nhắn đã lưu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/DemoIdentityRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/assistant/questions:
    post:
      tags:
        - Trợ lý
      summary: Hỏi Trợ lý Artly
      description: |
        Nhận câu hỏi hội thoại về kiến thức phổ thông, học tập, ngôn ngữ, viết
        lách, công nghệ, sáng tạo, mỹ thuật, cách dùng Artly hoặc thống kê bài
        viết theo chủ đề. Trợ lý trả lời bằng ngôn ngữ của người hỏi trong rào
        chắn phù hợp học đường. Câu hỏi thống kê được ánh xạ vào danh mục cho
        phép và phép đếm luôn do backend thực hiện.

        Request mới không cần ID. Response trả `conversation`; client dùng
        `conversation.id` ở các lượt sau để backend tự nạp tối đa 4 cặp tin gần
        nhất từ lịch sử đã lưu. Trường `history` vẫn được chấp nhận cho client
        stateless cũ, nhưng bị bỏ qua khi có `conversationId`.

        Model nội bộ chỉ trả về action JSON theo schema. Ví dụ mã nguồn an toàn
        chỉ được trả về dưới dạng văn bản; backend không thực thi SQL, shell,
        HTML hoặc mã từ model. `provider=MODEL_LLM` cho biết câu trả lời hoặc
        action đã đi qua model trên host được cấu hình; parser `LOCAL` vẫn xử lý
        tất định các câu đếm rõ ràng và câu hỏi về dịch vụ MVP của Artly.
      operationId: askAssistant
      security:
        - DemoUserId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantQuestionRequest"
            examples:
              countLandscape:
                summary: Đếm bài phong cảnh
                value:
                  question: Có bao nhiêu bài nói về chủ đề phong cảnh?
              identity:
                summary: Hỏi về trợ lý
                value:
                  question: Bạn là ai và có thể giúp mình những gì?
              generalKnowledge:
                summary: Hỏi kiến thức phổ thông
                value:
                  question: Giải thích vì sao bầu trời có màu xanh cho học sinh lớp 6.
              appService:
                summary: Hỏi cách dùng một dịch vụ Artly
                value:
                  question: Mình nhắn tin cho bạn học ở đâu?
              followUp:
                summary: Tiếp tục một hội thoại
                value:
                  question: Mình nên chuẩn bị dụng cụ gì?
                  conversationId: "60000000-0000-4000-8000-000000000001"
      responses:
        "200":
          description: Câu trả lời hoặc yêu cầu người dùng làm rõ câu hỏi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantResponse"
              examples:
                answered:
                  summary: Đã thống kê được chủ đề
                  value:
                    status: ANSWERED
                    intent: COUNT_POSTS_BY_TOPIC
                    answer: Hiện có 2 bài viết về chủ đề “Phong cảnh”.
                    provider: LOCAL
                    result:
                      count: 2
                      topic:
                        id: "10000000-0000-4000-8000-000000000001"
                        slug: phong-canh
                        name: Phong cảnh
                        aliases:
                          - Cảnh vật
                          - Landscape
                    conversation:
                      id: "60000000-0000-4000-8000-000000000001"
                      title: Có bao nhiêu bài nói về chủ đề phong cảnh?
                      createdAt: "2026-07-25T10:00:00Z"
                      updatedAt: "2026-07-25T10:00:00Z"
                needsClarification:
                  summary: Chưa xác định được chủ đề
                  value:
                    status: NEEDS_CLARIFICATION
                    intent: UNKNOWN
                    answer: Bạn muốn đếm bài viết về chủ đề nào?
                    provider: LOCAL
                conversation:
                  summary: Trả lời hội thoại bằng model nội bộ
                  value:
                    status: ANSWERED
                    intent: CHAT
                    answer: Ánh sáng Mặt Trời có nhiều màu. Khi đi qua khí quyển, ánh sáng xanh bị tán xạ mạnh nên mắt mình thấy bầu trời có màu xanh.
                    provider: MODEL_LLM
                appService:
                  summary: Hướng dẫn dịch vụ Artly bằng classifier cục bộ
                  value:
                    status: ANSWERED
                    intent: APP_SERVICE_HELP
                    answer: Mở Nhắn tin, chọn một người dùng, nhập nội dung rồi gửi. Bản REST hiện hỗ trợ tin nhắn văn bản bằng polling; chưa hỗ trợ ảnh hoặc realtime.
                    provider: LOCAL
                    appService: MESSAGES
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/DemoIdentityRequired"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/AssistantUnavailable"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token của phiên Supabase Auth hiện tại.

    DemoUserId:
      type: apiKey
      in: header
      name: X-User-ID
      description: |
        UUID của một tài khoản mẫu trong bảng `users`, gửi ở dạng chuỗi chuẩn có
        dấu gạch ngang. Đây là cơ chế chọn danh tính cho MVP, không phải API key
        hoặc auth production.
      x-example: "00000000-0000-4000-8000-000000000001"

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Số trang, bắt đầu từ 1.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100000
        default: 1
      example: 1

    DirectoryPageSize:
      name: pageSize
      in: query
      required: false
      description: Số người dùng hoặc chủ đề trên mỗi trang.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
      example: 20

    PostPageSize:
      name: pageSize
      in: query
      required: false
      description: Số bài viết trên mỗi trang.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 50
        default: 10
      example: 10

    CommentPageSize:
      name: pageSize
      in: query
      required: false
      description: Số bình luận trên mỗi trang.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
      example: 20

    MessagePageSize:
      name: pageSize
      in: query
      required: false
      description: Số tin nhắn trên mỗi trang.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
      example: 50

    TopicId:
      name: topicId
      in: query
      required: false
      description: ID chủ đề dùng để lọc bảng tin.
      schema:
        $ref: "#/components/schemas/ResourceId"
      example: "10000000-0000-4000-8000-000000000001"

    PeerId:
      name: peerId
      in: query
      required: true
      description: ID tài khoản mẫu còn lại trong cuộc trò chuyện.
      schema:
        $ref: "#/components/schemas/ResourceId"
      example: "00000000-0000-4000-8000-000000000002"

    PostId:
      name: id
      in: path
      required: true
      description: ID bài viết.
      schema:
        $ref: "#/components/schemas/ResourceId"
      example: "20000000-0000-4000-8000-000000000001"

    CommentId:
      name: commentId
      in: path
      required: true
      description: ID bình luận cần xóa.
      schema:
        $ref: "#/components/schemas/ResourceId"
      example: "30000000-0000-4000-8000-000000000001"

    AssistantConversationPageSize:
      name: pageSize
      in: query
      required: false
      description: Số hội thoại lịch sử trên mỗi trang.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 30
      example: 30

    AssistantConversationId:
      name: id
      in: path
      required: true
      description: ID hội thoại của trợ lý.
      schema:
        $ref: "#/components/schemas/ResourceId"
      example: "60000000-0000-4000-8000-000000000001"

  schemas:
    ResourceId:
      type: string
      format: uuid
      description: |
        UUID PostgreSQL biểu diễn dưới dạng chuỗi. Client phải xem ID là giá trị
        opaque, không chuyển sang số hoặc suy luận thứ tự từ ID.
      examples:
        - "00000000-0000-4000-8000-000000000001"
        - "10000000-0000-4000-8000-000000000001"
        - "20000000-0000-4000-8000-000000000001"
        - "50000000-0000-4000-8000-000000000001"

    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - OK
          description: Trạng thái sẵn sàng của API.

    Pagination:
      type: object
      additionalProperties: false
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
          description: Trang hiện tại.
          examples:
            - 1
        pageSize:
          type: integer
          format: int32
          minimum: 1
          description: Số phần tử tối đa trong một trang.
          examples:
            - 10
        totalItems:
          type: integer
          format: int64
          minimum: 0
          description: Tổng số phần tử thỏa điều kiện.
          examples:
            - 21
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: |
            Tổng số trang. Bằng 0 khi không có phần tử nào thỏa điều kiện.
          examples:
            - 3

    UserRole:
      type: string
      enum:
        - STUDENT
        - TEACHER
      description: Vai trò của tài khoản mẫu.

    User:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - displayName
        - role
        - isSuperAdmin
      properties:
        id:
          $ref: "#/components/schemas/ResourceId"
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[a-z0-9._-]+$"
          description: Tên tài khoản duy nhất.
          examples:
            - minh.an
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Tên hiển thị.
          examples:
            - Trần Minh An
        role:
          $ref: "#/components/schemas/UserRole"
        isSuperAdmin:
          type: boolean
          description: Cho phép tài khoản quản trị xóa bài viết của người khác.
          default: false
        avatarUrl:
          type:
            - string
            - "null"
          format: uri
          maxLength: 2048
          description: URL ảnh đại diện; có thể là null nếu chưa đặt.
          examples:
            - https://i.pravatar.cc/256?img=12

    DemoLoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[a-z0-9._-]+$"
          description: Username của tài khoản demo.
          examples:
            - thu.ha.cafe
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
          description: Mật khẩu demo; mặc định là `artly-demo`.
          examples:
            - artly-demo

    UserResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/User"

    UserListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        pagination:
          $ref: "#/components/schemas/Pagination"

    Topic:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - name
      properties:
        id:
          $ref: "#/components/schemas/ResourceId"
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: Định danh URL không dấu của chủ đề.
          examples:
            - phong-canh
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Tên chuẩn bằng tiếng Việt.
          examples:
            - Phong cảnh
        aliases:
          type: array
          description: Các cụm từ tương đương mà trợ lý có thể nhận diện.
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
          examples:
            - - Cảnh vật
              - Landscape

    TopicListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Topic"
        pagination:
          $ref: "#/components/schemas/Pagination"

    Post:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - caption
        - imageUrl
        - author
        - topics
        - reactionCount
        - commentCount
        - viewerHasReacted
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/ResourceId"
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Tiêu đề bài thi vẽ.
          examples:
            - Mầm xanh tương lai
        caption:
          type: string
          minLength: 1
          maxLength: 2000
          description: Phần mô tả do người đăng nhập.
          examples:
            - Bài vẽ màu nước về những bàn tay cùng nâng niu một mầm cây xanh.
        imageUrl:
          type: string
          format: uri
          maxLength: 2048
          description: URL ảnh bài vẽ; MVP chưa hỗ trợ upload file.
          examples:
            - http://localhost:5173/demo-art/mam-xanh-tuong-lai.png
        examName:
          type: string
          minLength: 1
          maxLength: 160
          description: Tên cuộc thi hoặc bài kiểm tra, nếu có.
          examples:
            - Sắc màu xanh 2026
        author:
          $ref: "#/components/schemas/User"
        topics:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Topic"
        reactionCount:
          type: integer
          format: int64
          minimum: 0
          description: Tổng số tài khoản đã reaction bài viết.
          examples:
            - 2
        commentCount:
          type: integer
          format: int64
          minimum: 0
          description: Tổng số bình luận hiện có của bài viết.
          examples:
            - 1
        viewerHasReacted:
          type: boolean
          description: Tài khoản hiện tại đã reaction hay chưa.
          examples:
            - false
        createdAt:
          type: string
          format: date-time
          description: Thời điểm tạo theo RFC 3339.
          examples:
            - "2026-07-24T08:30:00+07:00"

    CreatePostRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - caption
        - imageUrl
        - topicIds
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Tiêu đề sau khi đã loại bỏ khoảng trắng đầu và cuối.
        caption:
          type: string
          minLength: 1
          maxLength: 2000
          description: Mô tả sau khi đã loại bỏ khoảng trắng đầu và cuối.
        imageUrl:
          type: string
          format: uri
          maxLength: 2048
          description: URL tuyệt đối dùng giao thức HTTP hoặc HTTPS.
        examName:
          type: string
          minLength: 1
          maxLength: 160
          description: Tên cuộc thi hoặc bài kiểm tra, nếu có.
        topicIds:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          description: Từ một đến năm ID chủ đề đã tồn tại.
          items:
            $ref: "#/components/schemas/ResourceId"

    PostResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Post"

    PostListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        pagination:
          $ref: "#/components/schemas/Pagination"

    Comment:
      type: object
      additionalProperties: false
      required:
        - id
        - postId
        - body
        - author
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/ResourceId"
        postId:
          $ref: "#/components/schemas/ResourceId"
        body:
          type: string
          minLength: 1
          maxLength: 3000
          description: |
            Nội dung văn bản thuần đã được trim khoảng trắng Unicode và không
            chứa ký tự U+0000.
          examples:
            - Em rất thích cách bạn phối màu cho phần bầu trời.
        author:
          $ref: "#/components/schemas/User"
        createdAt:
          type: string
          format: date-time
          description: Thời điểm tạo theo RFC 3339.
          examples:
            - "2026-07-25T09:15:00+07:00"

    CreateCommentRequest:
      type: object
      additionalProperties: false
      required:
        - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 3000
          description: |
            Nội dung văn bản thuần. Backend trim khoảng trắng Unicode ở hai đầu,
            sau đó yêu cầu từ 1 đến 3000 ký tự Unicode và không chứa U+0000.

    CommentResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Comment"

    CommentListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        pagination:
          $ref: "#/components/schemas/Pagination"

    ReactionState:
      type: object
      additionalProperties: false
      required:
        - reactionCount
        - viewerHasReacted
      properties:
        reactionCount:
          type: integer
          format: int64
          minimum: 0
          description: Tổng số reaction sau thao tác.
          examples:
            - 3
        viewerHasReacted:
          type: boolean
          description: Trạng thái reaction của tài khoản hiện tại sau thao tác.
          examples:
            - true

    ReactionResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/ReactionState"

    Message:
      type: object
      additionalProperties: false
      required:
        - id
        - sender
        - receiver
        - body
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/ResourceId"
        sender:
          $ref: "#/components/schemas/User"
        receiver:
          $ref: "#/components/schemas/User"
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: Nội dung thuần văn bản; frontend không render dưới dạng HTML.
          examples:
            - Em thử tăng độ tương phản ở vùng tiền cảnh nhé, bố cục đang rất tốt.
        createdAt:
          type: string
          format: date-time
          description: Thời điểm gửi theo RFC 3339.
          examples:
            - "2026-07-24T09:10:00+07:00"

    CreateMessageRequest:
      type: object
      additionalProperties: false
      required:
        - recipientId
        - body
      properties:
        recipientId:
          $ref: "#/components/schemas/ResourceId"
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: Nội dung thuần văn bản sau khi bỏ khoảng trắng hai đầu.

    MessageResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/Message"

    MessageListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AssistantStatus:
      type: string
      enum:
        - ANSWERED
        - NEEDS_CLARIFICATION
      description: Kết quả xử lý câu hỏi.

    AssistantIntent:
      type: string
      enum:
        - COUNT_POSTS_BY_TOPIC
        - APP_SERVICE_HELP
        - CHAT
        - UNKNOWN
      description: Ý định an toàn do parser hoặc model nhận diện được.

    AssistantAppService:
      type: string
      enum:
        - GENERAL
        - ACCOUNT
        - FEED
        - POSTS
        - REACTIONS
        - MESSAGES
        - PROFILE
        - ASSISTANT
      description: Nhóm dịch vụ Artly được classifier cục bộ nhận diện.

    AssistantProvider:
      type: string
      enum:
        - LOCAL
        - OPENAI
        - MODEL_LLM
      description: Bộ xử lý thực tế đã tạo câu trả lời hoặc action.

    AssistantConversationRole:
      type: string
      enum:
        - USER
        - ASSISTANT
      description: Vai trò của một tin nhắn lịch sử đã hoàn tất.

    AssistantConversationMessage:
      type: object
      additionalProperties: false
      required:
        - role
        - content
      properties:
        role:
          $ref: "#/components/schemas/AssistantConversationRole"
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            Nội dung thuần văn bản. Tin USER tối đa 500 ký tự; tin ASSISTANT
            tối đa 2000 ký tự.

    AssistantQuestionRequest:
      type: object
      additionalProperties: false
      required:
        - question
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 500
          description: |
            Câu hỏi thuần văn bản. Backend không thực thi chỉ dẫn, SQL, shell
            hoặc HTML có trong nội dung này.
          examples:
            - Có bao nhiêu bài nói về chủ đề phong cảnh?
        conversationId:
          $ref: "#/components/schemas/ResourceId"
        history:
          type: array
          maxItems: 8
          description: |
            Tối đa 4 cặp USER/ASSISTANT hoàn chỉnh, bắt đầu bằng USER và đúng
            thứ tự xen kẽ. Đây là context hội thoại, không phải chỉ dẫn hệ thống.
          items:
            $ref: "#/components/schemas/AssistantConversationMessage"

    AssistantCountResult:
      type: object
      additionalProperties: false
      required:
        - count
        - topic
      properties:
        count:
          type: integer
          format: int64
          minimum: 0
          description: Số bài viết khác nhau được gắn chủ đề.
          examples:
            - 2
        topic:
          $ref: "#/components/schemas/Topic"

    AssistantResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - intent
        - answer
        - provider
      properties:
        status:
          $ref: "#/components/schemas/AssistantStatus"
        intent:
          $ref: "#/components/schemas/AssistantIntent"
        answer:
          type: string
          minLength: 1
          maxLength: 2000
          description: Câu trả lời tiếng Việt dạng thuần văn bản.
          examples:
            - Hiện có 2 bài viết về chủ đề “Phong cảnh”.
        provider:
          $ref: "#/components/schemas/AssistantProvider"
        appService:
          $ref: "#/components/schemas/AssistantAppService"
        result:
          $ref: "#/components/schemas/AssistantCountResult"
        conversation:
          $ref: "#/components/schemas/AssistantConversationSummary"

    AssistantConversationSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/ResourceId"
        title:
          type: string
          minLength: 1
          maxLength: 80
          description: Tiêu đề rút gọn tự động từ câu hỏi đầu tiên.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AssistantStoredMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - role
        - content
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/ResourceId"
        role:
          $ref: "#/components/schemas/AssistantConversationRole"
        content:
          type: string
          minLength: 1
          maxLength: 2000
        response:
          $ref: "#/components/schemas/AssistantResponse"
        createdAt:
          type: string
          format: date-time

    AssistantConversation:
      allOf:
        - $ref: "#/components/schemas/AssistantConversationSummary"
        - type: object
          required:
            - messages
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/AssistantStoredMessage"

    AssistantConversationListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AssistantConversationSummary"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AssistantConversationResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/AssistantConversation"

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/Error"

    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Z][A-Z0-9_]*$"
          description: Mã lỗi ổn định để frontend xử lý bằng máy.
          examples:
            - VALIDATION_ERROR
        message:
          type: string
          minLength: 1
          maxLength: 500
          description: Thông báo an toàn bằng tiếng Việt, không chứa stack trace.
          examples:
            - Dữ liệu không hợp lệ
        details:
          description: |
            Chi tiết có cấu trúc giúp sửa request. Có thể là object rỗng nếu
            không có thông tin bổ sung và không bao giờ chứa secret hay stack trace.
          examples:
            - fields:
                caption:
                  - Nội dung mô tả là bắt buộc.

  responses:
    BadRequest:
      description: Request không đọc được hoặc tham số sai định dạng.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            malformedRequest:
              summary: JSON không hợp lệ
              value:
                error:
                  code: BAD_REQUEST
                  message: Không thể đọc dữ liệu gửi lên
                  details: {}

    DemoIdentityRequired:
      description: |
        Thiếu danh tính, access token không hợp lệ hoặc tài khoản mẫu trong
        `X-User-ID` không tồn tại.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missingIdentity:
              summary: Chưa chọn tài khoản mẫu
              value:
                error:
                  code: DEMO_USER_REQUIRED
                  message: Vui lòng chọn một tài khoản mẫu
                  details:
                    header: X-User-ID

    InvalidDemoCredentials:
      description: Username hoặc mật khẩu demo không đúng.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidCredentials:
              summary: Sai tài khoản hoặc mật khẩu
              value:
                error:
                  code: INVALID_DEMO_CREDENTIALS
                  message: Sai tài khoản hoặc mật khẩu demo
                  details: {}

    Forbidden:
      description: Tài khoản hiện tại không được phép truy cập tài nguyên.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            forbidden:
              summary: Không có quyền truy cập
              value:
                error:
                  code: FORBIDDEN
                  message: Bạn không có quyền truy cập tài nguyên này
                  details: {}

    NotFound:
      description: Tài nguyên được yêu cầu không tồn tại.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            notFound:
              summary: Không tìm thấy tài nguyên
              value:
                error:
                  code: NOT_FOUND
                  message: Không tìm thấy tài nguyên
                  details: {}

    ValidationError:
      description: Dữ liệu có đúng định dạng JSON nhưng không đạt điều kiện.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidFields:
              summary: Một trường không hợp lệ
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Dữ liệu không hợp lệ
                  details:
                    fields:
                      caption:
                        - Nội dung mô tả là bắt buộc.

    Conflict:
      description: Request xung đột với trạng thái dữ liệu hiện tại.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            conflict:
              summary: Dữ liệu bị xung đột
              value:
                error:
                  code: CONFLICT
                  message: Dữ liệu đã thay đổi, vui lòng thử lại
                  details: {}

    TooManyRequests:
      description: Người dùng gửi quá nhiều request trong một khoảng thời gian.
      headers:
        Retry-After:
          description: Số giây nên chờ trước khi thử lại.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            rateLimited:
              summary: Vượt giới hạn request
              value:
                error:
                  code: RATE_LIMITED
                  message: Bạn đang gửi yêu cầu quá nhanh, vui lòng thử lại sau
                  details:
                    retryAfterSeconds: "30"

    PayloadTooLarge:
      description: Body của request vượt quá giới hạn 64 KiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            payloadTooLarge:
              summary: Body vượt giới hạn
              value:
                error:
                  code: PAYLOAD_TOO_LARGE
                  message: Dữ liệu gửi lên vượt quá giới hạn cho phép
                  details: {}

    RequestTimeout:
      description: Request không hoàn tất trong thời gian xử lý cho phép.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            requestTimeout:
              summary: Request hết thời gian
              value:
                error:
                  code: REQUEST_TIMEOUT
                  message: Yêu cầu xử lý quá lâu, vui lòng thử lại
                  details: {}

    AssistantUnavailable:
      description: Không thể kết nối hoặc xác thực phản hồi của model nội bộ.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            assistantUnavailable:
              summary: Model nội bộ tạm thời không khả dụng
              value:
                error:
                  code: ASSISTANT_UNAVAILABLE
                  message: Trợ lý đang tạm thời chưa kết nối được với mô hình, vui lòng thử lại sau
                  details: {}

    InternalServerError:
      description: Lỗi nội bộ đã được che giấu thông tin nhạy cảm.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internalError:
              summary: Lỗi máy chủ
              value:
                error:
                  code: INTERNAL_ERROR
                  message: Hệ thống đang gặp sự cố, vui lòng thử lại sau
                  details: {}
